name: build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C++ formatting (clang-format 23.1.5)
        run: |
          pipx install clang-format==23.1.5
          ./scripts/check_format.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      # BoringSSL's x86 assembly is NASM on Windows. Without it the build still works, with the portable C AEAD;
      # CI fails here instead so a missing assembler is not mistaken for a slow build. (pp-cpp-crypto builds it.)
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nasmDir = "C:\Program Files\NASM"
          choco install nasm --no-progress -y
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            Write-Host "Chocolatey did not install nasm; downloading from nasm.us"
            $ver = "2.16.03"
            $zip = "$env:RUNNER_TEMP\nasm.zip"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$ver/win64/nasm-$ver-win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\nasm" -Force
            New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
            Copy-Item "$env:RUNNER_TEMP\nasm\nasm-$ver\*" $nasmDir -Recurse -Force
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) { throw "nasm is not installed (Chocolatey and nasm.us both failed)" }
          echo $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_AMP_BUILD_TESTS=ON \
            "${generator[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  # AddressSanitizer + LeakSanitizer + UBSan over the whole suite. Use-after-frees and ownership
  # cycles pass every other job silently: a handshake failure wrote into a freed handshake, and
  # self-owning closures leaked each burst dial, until a local sanitizer run found them.
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug \
            -DPP_AMP_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 4
